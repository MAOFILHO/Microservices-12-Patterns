name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each suite gets its own install: gateway/app and every
      # service's config.py share top-level module names, so they cannot
      # run in one interpreter (see CLAUDE.md, "collision note").
      matrix:
        include:
          - suite: repo-root
            requirements: requirements-dev.txt
            tests: tests/unit
          - suite: gateway
            requirements: gateway/requirements.txt
            tests: gateway/tests
            shared: fastapi
          - suite: registry
            requirements: registry/requirements.txt
            tests: registry/tests
          - suite: user
            requirements: services/user/requirements.txt
            tests: services/user/tests
            shared: flask
          - suite: catalog
            requirements: services/catalog/requirements.txt
            tests: services/catalog/tests
            shared: flask
            contracts: true
          - suite: order
            requirements: services/order/requirements.txt
            tests: services/order/tests
            shared: flask
            contracts: true
          - suite: payment
            requirements: services/payment/requirements.txt
            tests: services/payment/tests
            shared: flask
            contracts: true
          - suite: inventory
            requirements: services/inventory/requirements.txt
            tests: services/inventory/tests
            shared: flask
            contracts: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }} pytest==8.3.4 pytest-asyncio==0.25.0

      - name: Install shared observability package (shop_common)
        if: matrix.shared
        run: pip install "./shared[${{ matrix.shared }}]"

      - name: Install Pact (contract tests)
        if: matrix.contracts
        run: pip install -r contracts/requirements.txt

      - name: Run tests
        run: python -m pytest ${{ matrix.tests }} -v

      # The order suite regenerates the contracts it consumes. If they differ from the committed
      # files, the consumer changed what it needs without committing the new contract.
      - name: Contracts are up to date
        if: matrix.suite == 'order'
        run: git diff --exit-code contracts/pacts

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  containers:
    # Pattern 9. Builds every image exactly as Azure will run it (linux/amd64), starts it, and checks
    # it answers /health and does not run as root. Nothing is pushed anywhere.
    name: Container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: user, dir: services/user, port: 5101, shared: true }
          - { image: catalog, dir: services/catalog, port: 5102, shared: true }
          - { image: order, dir: services/order, port: 5103, shared: true }
          - { image: payment, dir: services/payment, port: 5104, shared: true }
          - { image: inventory, dir: services/inventory, port: 5105, shared: true }
          - { image: gateway, dir: gateway, port: 8100, shared: true }
          - { image: registry, dir: registry, port: 8500, shared: false }
    steps:
      - uses: actions/checkout@v4

      - name: Stage shared package (shop_common)
        if: matrix.shared
        run: cp -r shared "${{ matrix.dir }}/_shared"

      - name: Build for linux/amd64
        run: >
          docker build --platform linux/amd64 --build-arg GIT_SHA=${{ github.sha }}
          -t ms12p-${{ matrix.image }}:${{ github.sha }} ${{ matrix.dir }}

      - name: Run it, check health and that it is not root
        run: |
          docker run -d --name svc -p ${{ matrix.port }}:${{ matrix.port }} -e RUN_MODE=local \
            ms12p-${{ matrix.image }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:${{ matrix.port }}/health && break; sleep 1; done
          curl -sf http://127.0.0.1:${{ matrix.port }}/health
          uid=$(docker exec svc id -u)
          echo "runs as uid $uid"
          test "$uid" != "0"
          size=$(docker image inspect ms12p-${{ matrix.image }}:${{ github.sha }} --format '{{.Size}}')
          echo "| ${{ matrix.image }} | $((size / 1024 / 1024)) MB | uid $uid | linux/amd64 |" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs svc || true

  bicep:
    name: Bicep (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles the templates only; nothing is deployed and no login is needed.
      - name: Build main.bicep
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
