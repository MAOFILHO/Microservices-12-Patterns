name: Deploy

# Pattern 3: the manual "Deploy" button. Nothing deploys on its own: a person presses
# "Run workflow" on main. Rebuilds only the services whose code changed since the commit they run
# (scripts/deploy_plan.py), tags each image with this commit, and updates those Container Apps.
#
# Signs in with OIDC (#8, make github-identity): GitHub asks Azure for a short-lived token, so no
# Azure password exists anywhere. The 3 ids it needs are secrets only so they stay masked in this
# public repo's logs.

on:
  workflow_dispatch:

permissions:
  id-token: write   # to request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed services to Azure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # deploy_plan diffs against the commit each app runs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Sign in to Azure (OIDC, no secret)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the registry and what each app runs now
        id: running
        run: |
          set -euo pipefail
          # Services, folders and resource group all come from scripts/service_table.py.
          RESOURCE_GROUP=$(python scripts/deploy_plan.py --resource-group)
          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          python scripts/deploy_plan.py --services > services.txt
          acr=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$acr" ]; then echo "Nothing provisioned in $RESOURCE_GROUP. Run make provision first."; exit 1; fi
          echo "acr=$acr" >> "$GITHUB_OUTPUT"
          running="{}"
          while read -r app _dir; do
            image=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv)
            tag="${image##*:}"
            # 'latest' or anything that is not a commit: unknown, so deploy_plan rebuilds it.
            if [[ "$tag" =~ ^[0-9a-f]{7,40}$ ]]; then value="\"$tag\""; else value=null; fi
            running=$(jq -c --arg app "$app" --argjson commit "$value" '.[$app] = $commit' <<< "$running")
          done < services.txt
          echo "$running" > running.json
          cat running.json

      - name: Decide what to rebuild
        id: plan
        run: |
          set -euo pipefail
          head=$(git rev-parse --short=12 HEAD)
          services=$(python scripts/deploy_plan.py "$head" < running.json | tr '\n' ' ')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $head: ${services:-nothing changed}"

      - name: Build, push and roll out each changed service
        if: steps.plan.outputs.services != ''
        env:
          ACR: ${{ steps.running.outputs.acr }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          SERVICES: ${{ steps.plan.outputs.services }}
        run: |
          set -euo pipefail
          echo "| Service | Commit | Image size | Health |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for svc in $SERVICES; do
            dir=$(awk -v s="$svc" '$1 == s {print $2}' services.txt)
            cp -r shared "$dir/_shared"
            az acr build --registry "$ACR" --resource-group "$RESOURCE_GROUP" \
              --image "$svc:$HEAD_SHA" --build-arg "GIT_SHA=$HEAD_SHA" --platform linux/amd64 "$dir"
            rm -rf "$dir/_shared"
            size=$(az acr manifest show --registry "$ACR" --name "$svc:$HEAD_SHA" -o json | python scripts/deploy_plan.py --size)
            az containerapp update -n "$svc" -g "$RESOURCE_GROUP" \
              --image "$ACR.azurecr.io/$svc:$HEAD_SHA" --set-env-vars "IMAGE_SIZE_MB=${size:-0}" -o none
            # "Update accepted" is not "running": wait until the service itself answers with the
            # new commit (this also wakes a scaled-to-zero app). A crash-looping revision fails the run.
            fqdn=$(az containerapp show -n "$svc" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
            running=""
            for attempt in $(seq 1 30); do
              running=$(curl -sf --max-time 10 "https://$fqdn/debug/runtime" | jq -r .git_sha || true)
              [ "$running" = "$HEAD_SHA" ] && break
              sleep 10
            done
            if [ "$running" != "$HEAD_SHA" ]; then
              echo "::error::$svc did not answer with $HEAD_SHA within 5 minutes (last seen: ${running:-nothing})"
              exit 1
            fi
            echo "| $svc | \`$HEAD_SHA\` | ${size:-?} MB | answering |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Nothing to deploy
        if: steps.plan.outputs.services == ''
        run: echo "Every service already runs ${{ steps.plan.outputs.head }}." >> "$GITHUB_STEP_SUMMARY"
